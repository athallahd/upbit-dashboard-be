services:
  mysql:
    image: mysql:8.4
    container_name: upbit-dashboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: upbit_dummy_dev
      MYSQL_USER: athallahd
      MYSQL_PASSWORD: upbit_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - ./local-db/mysql-data:/var/lib/mysql
      - ./local-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
